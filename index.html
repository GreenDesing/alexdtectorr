<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DetectorPI Pro v3.9-5V</title>
    <style>
        :root {
            --primary: #00d9ff;
            --secondary: #7c3aed;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --dark-1: #0a0e17;
            --dark-2: #12161f;
            --dark-3: #1a1f2e;
            --dark-4: #242938;
            --text-1: #ffffff;
            --text-2: #cbd5e1;
            --text-3: #64748b;
            --border: rgba(255, 255, 255, 0.1);
            --glow: 0 0 20px rgba(0, 217, 255, 0.3);
            --radius-sm: 12px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, var(--dark-1) 0%, var(--dark-2) 100%);
            color: var(--text-1);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 217, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(124, 58, 237, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .app-container {
            position: relative;
            z-index: 1;
        }

        /* Header Mejorado */
        .header {
            background: linear-gradient(135deg, var(--dark-2), var(--dark-3));
            padding: 1.5rem 1rem;
            border-bottom: 1px solid var(--border);
            box-shadow: var(--shadow);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex: 1;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            box-shadow: var(--glow);
            animation: pulse-glow 3s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: var(--glow); }
            50% { box-shadow: 0 0 30px rgba(0, 217, 255, 0.5); }
        }

        .logo-text h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: -4px;
        }

        .logo-text p {
            font-size: 0.7rem;
            color: var(--text-3);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .status-pills {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .pill {
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: var(--transition);
        }

        .pill.version {
            background: var(--primary);
            color: var(--dark-1);
        }

        .pill.status {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .pill.status.connected {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.2); }
        }

        /* Container */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 1.5rem 1rem 3rem;
        }

        /* Cards */
        .card {
            background: var(--dark-3);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .card:hover {
            border-color: rgba(0, 217, 255, 0.3);
            transform: translateY(-2px);
        }

        /* Connect Button Mejorado */
        .connect-section {
            text-align: center;
        }

        .connect-btn {
            width: 100%;
            padding: 1.2rem;
            border: none;
            border-radius: var(--radius-md);
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .connect-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .connect-btn:active::before {
            width: 400px;
            height: 400px;
        }

        .connect-btn.disconnected {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: var(--glow), var(--shadow);
        }

        .connect-btn.disconnected:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 217, 255, 0.5), var(--shadow);
        }

        .connect-btn.connected {
            background: linear-gradient(135deg, var(--danger), #dc2626);
            color: white;
        }

        .connect-btn.loading {
            background: var(--dark-4);
            color: var(--text-3);
            cursor: not-allowed;
        }

        /* Detection Display Premium */
        .detection-display {
            position: relative;
            background: linear-gradient(135deg, var(--dark-2), var(--dark-3));
            border-radius: var(--radius-lg);
            padding: 3rem 2rem;
            margin-bottom: 1.5rem;
            border: 2px solid var(--border);
            overflow: hidden;
            text-align: center;
        }

        .detection-display::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 217, 255, 0.1) 0%, transparent 70%);
            animation: rotate-slow 20s linear infinite;
        }

        @keyframes rotate-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .detection-content {
            position: relative;
            z-index: 1;
        }

        .detection-label {
            font-size: 0.85rem;
            color: var(--text-3);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1rem;
        }

        .detection-status {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 2rem;
            line-height: 1;
        }

        .detection-status.idle {
            color: var(--text-2);
        }

        .detection-status.detecting {
            background: linear-gradient(135deg, var(--success), #22c55e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glow-text 1.5s ease-in-out infinite;
        }

        .detection-status.ferrous {
            background: linear-gradient(135deg, var(--danger), #dc2626);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @keyframes glow-text {
            0%, 100% { filter: drop-shadow(0 0 10px currentColor); }
            50% { filter: drop-shadow(0 0 20px currentColor); }
        }

        .detection-metrics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }

        .metric {
            background: rgba(0, 0, 0, 0.3);
            border-radius: var(--radius-sm);
            padding: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .metric-label {
            font-size: 0.7rem;
            color: var(--text-3);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .metric-value {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--primary);
            font-variant-numeric: tabular-nums;
        }

        /* Signal Bar Premium */
        .signal-section {
            margin-bottom: 1.5rem;
        }

        .signal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        .signal-title {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .signal-icon {
            font-size: 1.3rem;
        }

        .signal-percentage {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .signal-bar-wrapper {
            position: relative;
            height: 100px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .signal-bar {
            height: 100%;
            background: linear-gradient(90deg, 
                var(--success) 0%, 
                var(--primary) 50%, 
                var(--danger) 100%);
            width: 0%;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            box-shadow: 0 0 30px currentColor;
        }

        .signal-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, 
                rgba(255, 255, 255, 0.3) 0%, 
                transparent 50%,
                rgba(0, 0, 0, 0.3) 100%);
        }

        .signal-marker {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: 2px;
            background: rgba(255, 255, 255, 0.5);
            transition: var(--transition);
        }

        .signal-values {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-top: 1rem;
        }

        .signal-item {
            text-align: center;
        }

        .signal-item-label {
            font-size: 0.7rem;
            color: var(--text-3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.3rem;
        }

        .signal-item-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-1);
            font-variant-numeric: tabular-nums;
        }

        /* Controls Premium */
        .controls-grid {
            display: grid;
            gap: 1.5rem;
        }

        .control-group {
            background: rgba(0, 0, 0, 0.2);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .control-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .control-label {
            font-size: 0.85rem;
            color: var(--text-2);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .control-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .control-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .control-btn {
            padding: 1rem;
            border: 2px solid var(--border);
            background: rgba(0, 0, 0, 0.3);
            color: var(--text-1);
            border-radius: var(--radius-sm);
            font-size: 1.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }

        .control-btn:hover {
            background: rgba(0, 217, 255, 0.1);
            border-color: var(--primary);
        }

        .control-btn:active {
            transform: scale(0.95);
            background: var(--primary);
            color: var(--dark-1);
        }

        .action-btn {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--primary);
            background: rgba(0, 217, 255, 0.1);
            color: var(--primary);
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .action-btn:hover {
            background: var(--primary);
            color: var(--dark-1);
            transform: translateY(-2px);
            box-shadow: var(--glow);
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background: var(--dark-3);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            border: 1px solid var(--border);
            text-align: center;
            transition: var(--transition);
        }

        .stat-card:hover {
            border-color: rgba(0, 217, 255, 0.3);
            transform: translateY(-2px);
        }

        .stat-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.3rem;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* History Premium */
        .history-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .history-title {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .history-badge {
            background: var(--primary);
            color: var(--dark-1);
            padding: 0.25rem 0.6rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .history-item {
            background: rgba(0, 0, 0, 0.3);
            border-radius: var(--radius-sm);
            padding: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: var(--transition);
        }

        .history-item:hover {
            border-color: rgba(0, 217, 255, 0.2);
            transform: translateX(4px);
        }

        .history-icon {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .history-icon.ferrous {
            background: linear-gradient(135deg, var(--danger), #dc2626);
        }

        .history-icon.non-ferrous {
            background: linear-gradient(135deg, var(--success), #22c55e);
        }

        .history-content {
            flex: 1;
        }

        .history-type {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.2rem;
        }

        .history-time {
            font-size: 0.75rem;
            color: var(--text-3);
        }

        .history-signal {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem 2rem;
            color: var(--text-3);
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.3;
        }

        /* Loading */
        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 640px) {
            .header {
                padding: 1rem;
            }

            .logo-text h1 {
                font-size: 1.2rem;
            }

            .detection-status {
                font-size: 2.25rem;
            }

            .detection-metrics {
                grid-template-columns: repeat(3, 1fr);
                gap: 0.75rem;
            }

            .metric {
                padding: 0.75rem;
            }

            .metric-value {
                font-size: 1.5rem;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Toast Notifications */
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--dark-3);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 1rem 1.5rem;
            box-shadow: var(--shadow);
            z-index: 1000;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.success {
            border-color: var(--success);
        }

        .toast.error {
            border-color: var(--danger);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header Premium -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <div class="logo-icon">🔍</div>
                    <div class="logo-text">
                        <h1>DetectorPI Pro</h1>
                        <p>Pulse Induction Advanced</p>
                    </div>
                </div>
                <div class="status-pills">
                    <div class="pill version">v3.9-5V</div>
                    <div class="pill status" id="statusPill">
                        <span class="status-dot"></span>
                        <span id="statusText">OFF</span>
                    </div>
                </div>
            </div>
        </header>

        <div class="container">
            <!-- Connection Card -->
            <div class="card connect-section">
                <button class="connect-btn disconnected" id="connectBtn" onclick="toggleConnection()">
                    <span id="connectBtnText">🔌 Conectar Detector</span>
                </button>
            </div>

            <!-- Detection Display -->
            <div class="detection-display">
                <div class="detection-content">
                    <div class="detection-label">ESTADO DE DETECCIÓN</div>
                    <div class="detection-status idle" id="detectionStatus">EN ESPERA</div>
                    <div class="detection-metrics">
                        <div class="metric">
                            <div class="metric-label">Señal</div>
                            <div class="metric-value" id="signalValue">0</div>
                        </div>
                        <div class="metric">
                            <div class="metric-label">Umbral</div>
                            <div class="metric-value" id="thresholdValue">500</div>
                        </div>
                        <div class="metric">
                            <div class="metric-label">Delta</div>
                            <div class="metric-value" id="deltaValue">0</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Signal Strength -->
            <div class="card signal-section">
                <div class="signal-header">
                    <div class="signal-title">
                        <span class="signal-icon">📊</span>
                        <span>Intensidad</span>
                    </div>
                    <div class="signal-percentage" id="signalPercent">0%</div>
                </div>
                <div class="signal-bar-wrapper">
                    <div class="signal-bar" id="signalBar"></div>
                    <div class="signal-marker" id="signalMarker" style="right: 0%;"></div>
                </div>
                <div class="signal-values">
                    <div class="signal-item">
                        <div class="signal-item-label">Baseline</div>
                        <div class="signal-item-value" id="baselineValue">0</div>
                    </div>
                    <div class="signal-item">
                        <div class="signal-item-label">Sens.</div>
                        <div class="signal-item-value" id="sensValue">5</div>
                    </div>
                    <div class="signal-item">
                        <div class="signal-item-label">Duty</div>
                        <div class="signal-item-value" id="dutyValue">22%</div>
                    </div>
                </div>
            </div>

            <!-- Stats Grid -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">🎯</div>
                    <div class="stat-value" id="totalDetections">0</div>
                    <div class="stat-label">Detecciones</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">⚡</div>
                    <div class="stat-value" id="avgSignal">0</div>
                    <div class="stat-label">Señal Promedio</div>
                </div>
            </div>

            <!-- Controls -->
            <div class="card controls-grid">
                <div class="control-group">
                    <div class="control-header">
                        <span class="control-label">Sensibilidad</span>
                        <span class="control-value" id="sensControl">5</span>
                    </div>
                    <div class="control-buttons">
                        <button class="control-btn" onclick="adjustSensitivity(-1)">−</button>
                        <button class="control-btn" onclick="adjustSensitivity(1)">+</button>
                    </div>
                </div>
                <button class="action-btn" onclick="calibrate()">
                    <span>🎯</span>
                    <span>Recalibrar Detector</span>
                </button>
            </div>

            <!-- Detection History -->
            <div class="card">
                <div class="history-header">
                    <div class="history-title">
                        <span>🕐</span>
                        <span>Historial</span>
                    </div>
                    <span class="history-badge" id="historyCount">0</span>
                </div>
                <div class="history-list" id="historyList">
                    <div class="empty-state">
                        <div class="empty-icon">📭</div>
                        <p>Sin detecciones registradas</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast" id="toast"></div>

    <script>
        // BLE Configuration
        const SERVICE_UUID = '12345678-1234-1234-1234-123456789abc';
        const CHAR_UUID = '12345678-1234-1234-1234-123456789abd';

        let bluetoothDevice = null;
        let characteristic = null;
        let isConnected = false;
        let detectionHistory = [];
        let stats = {
            total: 0,
            avgSignal: 0
        };

        // UI Elements
        const connectBtn = document.getElementById('connectBtn');
        const statusPill = document.getElementById('statusPill');
        const statusText = document.getElementById('statusText');
        const detectionStatus = document.getElementById('detectionStatus');
        const signalBar = document.getElementById('signalBar');
        const signalMarker = document.getElementById('signalMarker');
        const signalPercent = document.getElementById('signalPercent');

        // Toggle Connection
        async function toggleConnection() {
            if (isConnected) {
                disconnect();
            } else {
                await connect();
            }
        }

        // Connect BLE
        async function connect() {
            try {
                connectBtn.className = 'connect-btn loading';
                connectBtn.innerHTML = '<span class="spinner"></span>';
                
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'DetectorPI' }],
                    optionalServices: [SERVICE_UUID]
                });

                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                characteristic = await service.getCharacteristic(CHAR_UUID);
                
                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', handleData);

                isConnected = true;
                updateUI(true);
                showToast('Conectado exitosamente', 'success');
                
            } catch (error) {
                console.error('Error:', error);
                showToast('Error al conectar: ' + error.message, 'error');
                updateUI(false);
            }
        }

        // Disconnect
        function disconnect() {
            if (bluetoothDevice && bluetoothDevice.gatt.connected) {
                bluetoothDevice.gatt.disconnect();
            }
            isConnected = false;
            updateUI(false);
            showToast('Desconectado', 'success');
        }

        // Update UI
        function updateUI(connected) {
            if (connected) {
                connectBtn.className = 'connect-btn connected';
                connectBtn.innerHTML = '🔌 Desconectar';
                statusPill.className = 'pill status connected';
                statusText.textContent = 'ON';
            } else {
                connectBtn.className = 'connect-btn disconnected';
                connectBtn.innerHTML = '🔌 Conectar Detector';
                statusPill.className = 'pill status';
                statusText.textContent = 'OFF';
            }
        }

        // Handle Data
        function handleData(event) {
            const value = event.target.value;
            const text = new TextDecoder().decode(value);
            
            try {
                const data = JSON.parse(text);
                const mappedData = {
                    delta: data.d || 0,
                    signal: data.d || 0,
                    threshold: data.u || 500,
                    baseline: data.b || 0,
                    sensitivity: data.s || 5,
                    ferrous: data.t === 'F',
                    duty: data.dc || 22,
                    detected: data.det === 1
                };
                
                updateDisplay(mappedData);
            } catch (e) {
                console.error('Parse error:', e);
            }
        }

        // Update Display
        function updateDisplay(data) {
            // Update values
            document.getElementById('signalValue').textContent = data.signal;
            document.getElementById('thresholdValue').textContent = data.threshold;
            document.getElementById('deltaValue').textContent = data.delta;
            document.getElementById('baselineValue').textContent = data.baseline;
            document.getElementById('sensValue').textContent = data.sensitivity;
            document.getElementById('sensControl').textContent = data.sensitivity;
            document.getElementById('dutyValue').textContent = data.duty + '%';

            // Update signal bar
            const percentage = Math.min((data.delta / data.threshold) * 100, 100);
            signalBar.style.width = percentage + '%';
            signalMarker.style.right = (100 - percentage) + '%';
            signalPercent.textContent = Math.round(percentage) + '%';

            // Update detection status
            if (data.detected) {
                const type = data.ferrous ? 'ferroso' : 'non-ferrous';
                const icon = data.ferrous ? '🧲' : '🪙';
                const label = data.ferrous ? 'FERROSO' : 'NO-FERROSO';
                
                detectionStatus.textContent = icon + ' ' + label;
                detectionStatus.className = 'detection-status detecting ' + type;
                
                addDetection(data);
            } else {
                detectionStatus.textContent = 'EN ESPERA';
                detectionStatus.className = 'detection-status idle';
            }
        }

        // Add Detection
        function addDetection(data) {
            const detection = {
                type: data.ferrous ? 'Ferroso' : 'No-Ferroso',
                icon: data.ferrous ? '🧲' : '🪙',
                signal: data.signal,
                time: new Date().toLocaleTimeString(),
                ferrous: data.ferrous
            };

            detectionHistory.unshift(detection);
            if (detectionHistory.length > 20) {
                detectionHistory.pop();
            }

            stats.total++;
            stats.avgSignal = Math.round(
                detectionHistory.reduce((sum, d) => sum + d.signal, 0) / detectionHistory.length
            );

            updateHistory();
            updateStats();
        }

        // Update History
        function updateHistory() {
            const container = document.getElementById('historyList');
            const count = document.getElementById('historyCount');
            
            count.textContent = detectionHistory.length;

            if (detectionHistory.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📭</div>
                        <p>Sin detecciones registradas</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = detectionHistory.slice(0, 10).map(d => `
                <div class="history-item">
                    <div class="history-icon ${d.ferrous ? 'ferrous' : 'non-ferrous'}">
                        ${d.icon}
                    </div>
                    <div class="history-content">
                        <div class="history-type">${d.type}</div>
                        <div class="history-time">${d.time}</div>
                    </div>
                    <div class="history-signal">${d.signal}</div>
                </div>
            `).join('');
        }

        // Update Stats
        function updateStats() {
            document.getElementById('totalDetections').textContent = stats.total;
            document.getElementById('avgSignal').textContent = stats.avgSignal;
        }

        // Adjust Sensitivity
        function adjustSensitivity(change) {
            if (!characteristic) {
                showToast('Conecta el detector primero', 'error');
                return;
            }
            
            const command = change > 0 ? 'S+' : 'S-';
            characteristic.writeValue(new TextEncoder().encode(command));
        }

        // Calibrate
        function calibrate() {
            if (!characteristic) {
                showToast('Conecta el detector primero', 'error');
                return;
            }
            
            if (confirm('¿Recalibrar? Aleja todos los metales.')) {
                characteristic.writeValue(new TextEncoder().encode('CAL'));
                showToast('Recalibrando...', 'success');
            }
        }

        // Show Toast
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type + ' show';
            
            setTimeout(() => {
                toast.className = 'toast ' + type;
            }, 3000);
        }
    </script>
</body>
</html>
